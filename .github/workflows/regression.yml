# Regression suite — runs on every push to main and every pull request.
# Builds the app against a throwaway Postgres in the runner (never the
# shared Neon DB), seeds the demo store, then clicks through every main
# screen and the flows in e2e/*.spec.ts. See e2e/README.md.
name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rl_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # Throwaway values only — no real secrets are used or needed. Every
    # external service (SMTP, Better Stack, Blob, gold-rate API, Google
    # sign-in) is blanked so nothing leaves the runner.
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rl_e2e
      NEXTAUTH_SECRET: ci-e2e-secret-not-real
      NEXTAUTH_URL: http://localhost:3100
      E2E_PORT: "3100"
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: ""
      BETTER_STACK_SOURCE_TOKEN: ""
      BETTER_STACK_INGESTING_HOST: ""
      BETTERSTACK_RUM_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
      GOLD_API_KEY: ""
      CRON_SECRET: ci
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      SUPER_ADMIN_EMAILS: ""
      SUPER_ADMIN_PHONES: ""

    steps:
      - uses: actions/checkout@v5

      # Exact version, not "11": pnpm 11.28.3 (released 2026-09-30) fails
      # install with ERR_PNPM_BAD_PACKAGE_JSON on tsx's bundled fsevents, so
      # a floating major broke CI with no code change. Bump deliberately.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.28.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm skips Prisma's install script here (pnpm-workspace.yaml
      # allowBuilds), so the client must be generated before anything
      # that imports its types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Set up database (migrate + seed demo store)
        run: |
          npx prisma migrate deploy
          pnpm seed
          pnpm db:seed:full-demo
          pnpm db:backfill:fine-weights

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
